name: Publish images

# Builds multi-arch images and pushes them to Docker Hub when a version tag is pushed (v1.2.3), or
# when run by hand; a version tag then also gets a GitHub release (the `release` job below).
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (for example: edge)"
        required: false
        default: edge

permissions:
  contents: read

env:
  NAMESPACE: elrumo

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            image: webbites-web
          - app: api
            image: webbites-api
          - app: parse
            image: webbites-parse
          - app: screenshot
            image: webbites-screenshot
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    # A version tag also gets a GitHub release, once every image is on Docker Hub: notes generated
    # from the merged pull requests since the previous tag, and the images to pull.
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.2.0-rc.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Images on Docker Hub, tagged `${{ github.ref_name }}` without the `v` (and `latest`):
            `elrumo/webbites-web`, `elrumo/webbites-api`, `elrumo/webbites-parse`, `elrumo/webbites-screenshot`.

            Upgrading: set `WEBBITES_VERSION` in `deploy/.env`, then `docker compose pull && docker compose up -d`
            (see [docs/upgrade.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/upgrade.md)).
