name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile --ignore-scripts
      # tsconfig.json extends .nitro/types/tsconfig.json, which Nitro generates; the `#root/...` imports in the tests need it.
      - run: bunx nitro prepare
      - name: Run every test:* script
        run: |
          set -e
          for name in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(n => n.startsWith('test:')).join(' '))"); do
            echo "::group::$name"
            bun run "$name"
            echo "::endgroup::"
          done

  parse:
    name: Parse tests and build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/wb_settings_test
    defaults:
      run:
        working-directory: apps/parse
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  screenshot:
    name: Screenshot service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/screenshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx nuxt prepare
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NUXT_DISABLE_SOURCEMAPS: "1"

  deploy-files:
    name: Compose, installer and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse's settings allow-list matches the admin page's registry
        run: node scripts/check-settings-keys.mjs
      - name: A shell variable cannot override .env, and each secret reaches only its services
        run: node scripts/check-compose-env.mjs
      - name: shellcheck the scripts
        run: shellcheck deploy/install.sh deploy/get.sh apps/web/docker-entrypoint.sh apps/installer/packaging/build-macos-app.sh
      - name: The one-line installer sets up a folder from the deploy files alone
        run: |
          set -e
          cd "$RUNNER_TEMP"
          WEBBITES_SOURCE="file://$GITHUB_WORKSPACE/deploy" sh "$GITHUB_WORKSPACE/deploy/get.sh" --version 0.0.0 --no-start --http-port 8080
          grep -qx 'PUBLIC_URL=http://localhost:8080' webbites/.env
          grep -qx 'WEBBITES_VERSION=0.0.0' webbites/.env
          (cd webbites && docker compose config --quiet)
          # Again, as an upgrade: the version moves on, .env stays.
          WEBBITES_SOURCE="file://$GITHUB_WORKSPACE/deploy" sh "$GITHUB_WORKSPACE/deploy/get.sh" --version 0.0.1 --no-start
          grep -qx 'WEBBITES_VERSION=0.0.1' webbites/.env
          test -f webbites/.previous/docker-compose.yml
      - name: Generate an .env and validate the compose file in every profile combination
        working-directory: deploy
        run: |
          set -e
          ./install.sh --yes --domain test.example.com --email ci@example.com --rustfs
          for profiles in "" "screenshots" "rustfs" "screenshots,rustfs"; do
            echo "profiles: '$profiles'"
            COMPOSE_PROFILES="$profiles" docker compose config --quiet
          done
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=test.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

  installer:
    name: Desktop app (vet, tests, Linux and Windows builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/installer/go.mod
          cache-dependency-path: apps/installer/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Includes the check that the app writes the same .env as deploy/install.sh.
      - run: go test ./...
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o /dev/null .

  installer-macos:
    name: Desktop app (macOS bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/installer/go.mod
          cache-dependency-path: apps/installer/go.sum
      - run: apps/installer/packaging/build-macos-app.sh 0.0.0-ci "$RUNNER_TEMP/dist"

  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, parse, screenshot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
